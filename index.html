  --accent-l: #7a1f3d; --accent-d: #e39ab4; --on-l: #ffffff; --on-d: #1b1a19;

* { box-sizing: border-box; }

.lt { border: 0; padding: 0; background: none; display: grid; gap: 6px; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }

.pin { break-inside: avoid; display: block; width: 100%; margin: 0 0 14px; padding: 0; border: 0; background: none; text-align: left; }
.pin .ph { display: block; position: relative; border-radius: 22px; overflow: hidden; background: var(--board); }

.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 18px; border: 0; background: none; text-align: left; border-bottom: 1px solid var(--line); font-size: 16px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 90px); transform: translate(-50%, 16px); z-index: 80; max-width: calc(100% - 36px); background: var(--ink); color: var(--on-ink); padding: 11px 20px; border-radius: 999px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; text-align: center; }

<script>
/* engine.js: colors, weather helpers and outfit suggestions. No DOM in here, so it can be tested on its own. */
const Engine = (() => {
  const CATS = [
    { id: 'top',    label: 'Tops',        one: 'Top' },
    { id: 'bottom', label: 'Bottoms',     one: 'Bottom' },
    { id: 'dress',  label: 'Dresses',     one: 'Dress' },
    { id: 'outer',  label: 'Jackets',     one: 'Jacket' },
    { id: 'shoes',  label: 'Shoes',       one: 'Shoes' },
    { id: 'acc',    label: 'Accessories', one: 'Accessory' }
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

  // Accessory kinds. group: jewel (metal matters), carry (bag, belt), warm (cold-weather only)
  const SUBS = [
    { id: 'earrings', label: 'Earrings', group: 'jewel', w: 2.5, metal: true },
    { id: 'necklace', label: 'Necklace', group: 'jewel', w: 2.2, metal: true },
    { id: 'ring',     label: 'Ring',     group: 'jewel', w: 1.6, metal: true },
    { id: 'bracelet', label: 'Bracelet', group: 'jewel', w: 1.2, metal: true },
    { id: 'watch',    label: 'Watch',    group: 'jewel', w: 2.0, metal: true },
    { id: 'belt',     label: 'Belt',     group: 'carry', w: 1.5, metal: true },
    { id: 'bag',      label: 'Bag',      group: 'carry', w: 3.0, metal: false },
    { id: 'scarf',    label: 'Scarf',    group: 'warm',  w: 1, metal: false },
    { id: 'hat',      label: 'Hat',      group: 'warm',  w: 1, metal: false },
    { id: 'other',    label: 'Other',    group: 'other', w: 0.8, metal: false }
  ];
  const SUB = Object.fromEntries(SUBS.map(s => [s.id, s]));
  const subOf = a => a.sub && SUB[a.sub] ? a.sub : (a.warmth === 3 ? 'scarf' : 'other');
  const isWarmAcc = a => SUB[subOf(a)].group === 'warm' || a.warmth === 3;

  // hue is in degrees for colors that count as "colors"; null for neutrals (they go with everything)
  const COLORS = [
    { id: 'black',    name: 'Black',    hex: '#1c1c1e', hue: null },
    { id: 'white',    name: 'White',    hex: '#f4f4f0', hue: null },
    { id: 'grey',     name: 'Grey',     hex: '#8e8e93', hue: null },
    { id: 'cream',    name: 'Cream',    hex: '#eadfc8', hue: null },
    { id: 'tan',      name: 'Tan',      hex: '#c19a6b', hue: null },
    { id: 'brown',    name: 'Brown',    hex: '#6f4a2f', hue: null },
    { id: 'navy',     name: 'Navy',     hex: '#1f2c4d', hue: null },
    { id: 'denim',    name: 'Denim',    hex: '#5878a8', hue: null },
    { id: 'red',      name: 'Red',      hex: '#d92d2d', hue: 0 },
    { id: 'burgundy', name: 'Burgundy', hex: '#7a1f3d', hue: 345 },
    { id: 'pink',     name: 'Pink',     hex: '#f28cb1', hue: 335 },
    { id: 'orange',   name: 'Orange',   hex: '#f28c28', hue: 28 },
    { id: 'yellow',   name: 'Yellow',   hex: '#f4d03f', hue: 50 },
    { id: 'olive',    name: 'Olive',    hex: '#6b6b2f', hue: 65 },
    { id: 'green',    name: 'Green',    hex: '#3d9a58', hue: 135 },
    { id: 'blue',     name: 'Blue',     hex: '#2f6fe0', hue: 220 },
    { id: 'purple',   name: 'Purple',   hex: '#7e4fb8', hue: 275 }
  ];
  const COLOR = Object.fromEntries(COLORS.map(c => [c.id, c]));

  /* ---------- color detection from photo pixels ---------- */
  function rgb2lab(r, g, b) {
    const f = v => { v /= 255; return v > 0.04045 ? Math.pow((v + 0.055) / 1.055, 2.4) : v / 12.92; };
    const R = f(r), G = f(g), B = f(b);
    const X = (R * 0.4124 + G * 0.3576 + B * 0.1805) / 0.95047;
    const Y = R * 0.2126 + G * 0.7152 + B * 0.0722;
    const Z = (R * 0.0193 + G * 0.1192 + B * 0.9505) / 1.08883;
    const t = v => (v > 0.008856 ? Math.cbrt(v) : 7.787 * v + 16 / 116);
    const fx = t(X), fy = t(Y), fz = t(Z);
    return [116 * fy - 16, 500 * (fx - fy), 200 * (fy - fz)];
  }
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const PAL_LAB = COLORS.map(c => ({ id: c.id, lab: rgb2lab(...hexRgb(c.hex)) }));
  const d2 = (a, b) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 + (a[2] - b[2]) ** 2;

  // data: RGBA bytes of a small square image. Looks mostly at the middle and
  // gives less weight to pixels that look like the background around the edges.
  function detectColor(data, w, h) {
    let br = 0, bg = 0, bb = 0, bn = 0;
    const ring = Math.max(2, Math.round(w * 0.06));
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      if (x < ring || y < ring || x >= w - ring || y >= h - ring) {
        const i = (y * w + x) * 4; if (data[i + 3] < 128) continue;
        br += data[i]; bg += data[i + 1]; bb += data[i + 2]; bn++;
      }
    }
    const bgLab = bn ? rgb2lab(br / bn, bg / bn, bb / bn) : null;
    const votes = {};
    const cx = (w - 1) / 2, cy = (h - 1) / 2, sigma = w * 0.28;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      if (data[i + 3] < 128) continue;
      const lab = rgb2lab(data[i], data[i + 1], data[i + 2]);
      let wt = Math.exp(-(((x - cx) ** 2 + (y - cy) ** 2) / (2 * sigma * sigma)));
      if (bgLab && d2(lab, bgLab) < 12 * 12) wt *= 0.25;
      let best = null, bd = Infinity;
      for (const p of PAL_LAB) { const d = d2(lab, p.lab); if (d < bd) { bd = d; best = p.id; } }
      votes[best] = (votes[best] || 0) + wt;
    }
    let top = 'black', tv = -1;
    for (const k in votes) if (votes[k] > tv) { tv = votes[k]; top = k; }
    return top;
  }

  /* ---------- dates ---------- */
  const pad = n => String(n).padStart(2, '0');
  const dateStr = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const dayNum = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };

  /* ---------- weather ---------- */
  function codeInfo(code) {
    if (code === 0) return { label: 'Clear sky', icon: 'sun', wet: false, snow: false };
    if (code === 1) return { label: 'Mostly clear', icon: 'sun', wet: false, snow: false };
    if (code === 2) return { label: 'Partly cloudy', icon: 'cloud', wet: false, snow: false };
    if (code === 3) return { label: 'Overcast', icon: 'cloud', wet: false, snow: false };
    if (code === 45 || code === 48) return { label: 'Fog', icon: 'cloud', wet: false, snow: false };
    if (code >= 51 && code <= 57) return { label: 'Drizzle', icon: 'rain', wet: true, snow: false };
    if (code >= 61 && code <= 67) return { label: 'Rain', icon: 'rain', wet: true, snow: false };
    if (code >= 71 && code <= 77) return { label: 'Snow', icon: 'snow', wet: true, snow: true };
    if (code >= 80 && code <= 82) return { label: 'Rain showers', icon: 'rain', wet: true, snow: false };
    if (code === 85 || code === 86) return { label: 'Snow showers', icon: 'snow', wet: true, snow: true };
    if (code >= 95) return { label: 'Thunderstorm', icon: 'rain', wet: true, snow: false };
    return { label: 'Cloudy', icon: 'cloud', wet: false, snow: false };
  }

  // Open-Meteo JSON -> our weather object. Every field is read defensively.
  function parseForecast(j) {
    const c = (j && j.current) || {}, d = (j && j.daily) || {};
    const first = a => (Array.isArray(a) && a.length ? a[0] : undefined);
    const num = v => (typeof v === 'number' && isFinite(v) ? v : undefined);
    const temp = num(c.temperature_2m);
    const fMax = num(first(d.apparent_temperature_max)) ?? num(first(d.temperature_2m_max)) ?? temp;
    const fMin = num(first(d.apparent_temperature_min)) ?? num(first(d.temperature_2m_min)) ?? temp;
    if (fMax === undefined || fMin === undefined) throw new Error('forecast has no temperatures');
    const code = num(first(d.weather_code)) ?? num(c.weather_code) ?? 3;
    const info = codeInfo(code);
    const rain = num(first(d.precipitation_probability_max)) ?? 0;
    const wind = Math.max(num(c.wind_speed_10m) ?? 0, num(first(d.wind_speed_10m_max)) ?? 0);
    return {
      source: 'live', temp: temp ?? (fMin + fMax) / 2,
      hi: num(first(d.temperature_2m_max)) ?? fMax, lo: num(first(d.temperature_2m_min)) ?? fMin,
      fMin, fMax, rain, code, label: info.label, icon: info.icon,
      wet: info.wet || rain >= 50, snow: info.snow, wind, updated: Date.now()
    };
  }

  // Typical Copenhagen highs and lows by month, used only when the forecast can't be reached.
  const HI = [3, 3, 6, 11, 16, 19, 22, 22, 18, 13, 8, 5];
  const LO = [-1, -1, 0, 3, 7, 11, 14, 14, 11, 8, 4, 1];
  function estimateWeather(date) {
    const m = date.getMonth(), hi = HI[m], lo = LO[m];
    return {
      source: 'estimate', temp: (hi + lo) / 2, hi, lo, fMin: lo, fMax: hi, rain: 0, code: 3,
      label: 'Typical weather', icon: 'cloud', wet: false, snow: false, wind: 0, updated: Date.now(),
      month: date.toLocaleString('en-GB', { month: 'long' })
    };
  }

  const effectiveTemp = w => (w.fMin + w.fMax) / 2 - (w.wind >= 10 ? 2 : 0);

  /* ---------- outfit logic ---------- */
  const hd = (a, b) => { const d = Math.abs(a - b) % 360; return d > 180 ? 360 - d : d; };

  function colorScore(parts) {
    const chrom = [];
    let navy = false, black = false;
    for (const { item, w } of parts) {
      const c = COLOR[item.color]; if (!c) continue;
      if (c.id === 'navy') navy = true;
      if (c.id === 'black') black = true;
      if (c.hue !== null) chrom.push({ c, w });
    }
    const uniq = [...new Map(chrom.map(x => [x.c.id, x])).values()];
    let s = 0, note;
    if (uniq.length === 0) { s += 1; note = { kind: 'neutral' }; }
    else if (uniq.length === 1) { s += 1.6; note = { kind: 'pop', a: uniq[0].c }; }
    else if (uniq.length === 2) {
      const [A, B] = uniq, d = hd(A.c.hue, B.c.hue), f = Math.min(A.w, B.w);
      if (d <= 25) { s += 1.2; note = { kind: 'tone', a: A.c, b: B.c }; }
      else if (d <= 70) { s -= 1.8 * f; note = { kind: 'clash', a: A.c, b: B.c }; }
      else if (d <= 115) { s -= 0.3 * f; note = { kind: 'ok', a: A.c, b: B.c }; }
      else { s += 0.9; note = { kind: 'comp', a: A.c, b: B.c }; }
    } else { s -= 3; note = { kind: 'busy' }; }
    if (navy && black) s -= 1;
    return { score: s, note };
  }

  function recency(days) {
    if (days === null) return 1;
    if (days <= 1) return -3.5;
    if (days === 2) return -2;
    if (days === 3) return -1.2;
    if (days <= 6) return -0.4;
    return Math.min((days - 6) / 14, 1);
  }

  // How much insulation the outfit should add up to for a given "feels like" temperature.
  function needed(eff) {
    if (eff >= 24) return 1.5;
    if (eff >= 20) return 2;
    if (eff >= 16) return 3;
    if (eff >= 12) return 4;
    if (eff >= 8) return 5;
    if (eff >= 4) return 6;
    if (eff >= 0) return 7;
    return 8;
  }

  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  const labelOf = it => {
    if (it.name) return it.name;
    const col = (COLOR[it.color] || { name: '' }).name;
    if (it.category === 'acc') {
      const k = subOf(it), kind = SUB[k].label.toLowerCase();
      if (SUB[k].group === 'jewel') return `${it.metal === 'gold' ? 'Gold' : it.metal === 'silver' ? 'Silver' : col} ${kind}`.trim();
      return `${col} ${k === 'other' ? 'accessory' : kind}`.trim();
    }
    return `${col} ${CAT[it.category].one.toLowerCase()}`.trim();
  };

  function lastWorn(history) {
    const m = {};
    for (const h of history) for (const id of h.ids) if (!m[id] || h.date > m[id]) m[id] = h.date;
    return m;
  }

  function suggest({ items, history, weather, tag, seed, today, count = 3 }) {
    const eff = effectiveTemp(weather), wet = !!weather.wet;
    const avail = items.filter(i => !i.wash);
    const by = c => avail.filter(i => i.category === c);
    const tops = by('top'), bottoms = by('bottom'), dresses = by('dress'),
          outers = by('outer'), shoes = by('shoes'), accs = by('acc');
    const canTB = tops.length > 0 && bottoms.length > 0;
    if (!canTB && !dresses.length) {
      let need;
      if (!tops.length && !bottoms.length) need = 'a top and a bottom, or a dress';
      else if (!tops.length) need = 'a top';
      else need = 'a bottom';
      return { ok: false, need };
    }

    const r = rng(seed);
    const last = lastWorn(history), tNum = dayNum(today);
    const daysFor = it => (last[it.id] ? tNum - dayNum(last[it.id]) : null);
    const needOuter = outers.length > 0 && (eff < 14 || (wet && eff < 24));
    const noOuter = eff >= 20 && !wet;

    const cache = new Map();
    const solo = (it, role) => {
      const k = it.id + role;
      if (cache.has(k)) return cache.get(k);
      const W = { base: 1, outer: 0.25, shoes: 0.35, acc: 0.3 }[role];
      let s = recency(daysFor(it)) * W;
      if (it.fav) s += role === 'base' ? 0.8 : 0.3;
      if (tag) s += (it.tags || []).includes(tag) ? (role === 'base' ? 1.5 : 0.5) : (role === 'base' ? -0.8 : 0);
      if (wet && role === 'shoes') s += it.wp ? 1.5 : -0.6;
      if (wet && role === 'outer') s += it.wp ? 2.5 : -1;
      if (role === 'acc' && eff < 8 && it.warmth === 3) s += 1.5;
      cache.set(k, s);
      return s;
    };
    const pick = (list, role) => {
      const w = list.map(it => Math.exp(solo(it, role) / 2.2));
      let t = r() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < list.length; i++) { t -= w[i]; if (t <= 0) return list[i]; }
      return list[list.length - 1];
    };

    const metals = [...new Set(accs.filter(a => SUB[subOf(a)].metal && (a.metal === 'gold' || a.metal === 'silver')).map(a => a.metal))];
    const metalOk = (a, m) => !m || !SUB[subOf(a)].metal || a.metal !== (m === 'gold' ? 'silver' : 'gold');
    function pickAccs() {
      if (!accs.length) return [];
      const m = metals.length ? metals[Math.floor(r() * metals.length)] : null;
      const out = [];
      const bySub = {};
      for (const a of accs) if (metalOk(a, m)) (bySub[subOf(a)] = bySub[subOf(a)] || []).push(a);
      // cold: one warm piece first
      if (eff < 8) {
        const ws = Object.keys(bySub).filter(k => SUB[k].group === 'warm' || bySub[k].some(isWarmAcc));
        if (ws.length && r() < 0.9) {
          const k = ws[Math.floor(r() * ws.length)];
          out.push(pick(bySub[k].filter(isWarmAcc).length ? bySub[k].filter(isWarmAcc) : bySub[k], 'acc'));
          delete bySub[k];
        }
      }
      let keys = Object.keys(bySub).filter(k => SUB[k].group !== 'warm' && !(eff >= 12 && bySub[k].every(isWarmAcc)));
      if (eff >= 12) keys = keys.filter(k => !bySub[k].every(isWarmAcc));
      const target = Math.min(5, 3 + Math.floor(r() * 3));
      while (out.length < target && keys.length) {
        const ws = keys.map(k => SUB[k].w);
        let t = r() * ws.reduce((x, y) => x + y, 0), idx = keys.length - 1;
        for (let i = 0; i < keys.length; i++) { t -= ws[i]; if (t <= 0) { idx = i; break; } }
        const k = keys.splice(idx, 1)[0];
        const pool = eff >= 12 ? bySub[k].filter(a => !isWarmAcc(a)) : bySub[k];
        if (pool.length) out.push(pick(pool, 'acc'));
      }
      return out;
    }

    const wv = it => (it ? it.warmth || 2 : 0);
    const seen = new Map();
    for (let n = 0; n < 700; n++) {
      const useDress = dresses.length && (!canTB || r() < 0.28);
      let top = null, bottom = null, dress = null;
      if (useDress) dress = pick(dresses, 'base'); else { top = pick(tops, 'base'); bottom = pick(bottoms, 'base'); }
      let outer = null;
      if (outers.length) {
        if (needOuter) outer = pick(outers, 'outer');
        else if (!noOuter && r() < 0.5) outer = pick(outers, 'outer');
      }
      const shoe = shoes.length ? pick(shoes, 'shoes') : null;
      const accSet = pickAccs();
      const key = [top, bottom, dress, outer, shoe, ...accSet].filter(Boolean).map(i => i.id).join('|');
      if (seen.has(key)) continue;

      let score = 0;
      // average the base pieces so a dress (one piece) competes fairly with a top plus a bottom
      const baseParts = [top, bottom, dress].filter(Boolean);
      score += (baseParts.reduce((s, it) => s + solo(it, 'base'), 0) / baseParts.length) * 1.5;
      if (outer) score += solo(outer, 'outer');
      if (shoe) score += solo(shoe, 'shoes');
      for (const a of accSet) score += solo(a, 'acc') * 0.6;
      score += Math.min(accSet.length, 5) * 0.25;

      let insul = dress ? 1.5 * wv(dress) : wv(top) + 0.5 * wv(bottom);
      insul += wv(outer);
      if (eff < 8 && accSet.some(isWarmAcc)) insul += 0.5;
      const diff = insul - needed(eff);
      score -= diff < 0 ? -diff * 2.2 : diff * 1.2;
      if (noOuter && outer) score -= 3;

      const parts = [];
      for (const it of [top, bottom, dress, outer]) if (it) parts.push({ item: it, w: 1 });
      if (shoe) parts.push({ item: shoe, w: 0.5 });
      for (const a of accSet) if (a.color && ['bag', 'belt', 'scarf', 'hat'].includes(subOf(a))) parts.push({ item: a, w: 0.5 });
      const cs = colorScore(parts);
      score += cs.score + r() * 0.35;
      // belt and bag in the shoe color look put together
      if (shoe) for (const a of accSet) if (['bag', 'belt'].includes(subOf(a)) && a.color === shoe.color) score += 0.45;

      seen.set(key, { top, bottom, dress, outer, shoes: shoe, accs: accSet, score, note: cs.note, key });
    }

    const cands = [...seen.values()].sort((a, b) => b.score - a.score);
    const baseIds = c => (c.dress ? [c.dress.id] : [c.top.id, c.bottom.id]);
    const chosen = [];
    const pass = ok => {
      for (const c of cands) {
        if (chosen.length >= count) break;
        if (!chosen.includes(c) && ok(c)) chosen.push(c);
      }
    };
    pass(c => chosen.every(o => !baseIds(c).some(id => baseIds(o).includes(id))));
    pass(c => chosen.every(o => baseIds(c).join() !== baseIds(o).join()));
    pass(() => true);

    const ctx = { eff, wet, tag, daysFor, hasHistory: history.length > 0 };
    for (const o of chosen) {
      o.items = [o.dress, o.top, o.bottom, o.outer, o.shoes, ...o.accs].filter(Boolean);
      o.reasons = explain(o, ctx);
    }
    return { ok: true, list: chosen, eff, wet };
  }

  function explain(o, { eff, wet, tag, daysFor, hasHistory }) {
    const out = [], t = Math.round(eff);
    if (eff >= 24) out.push(`Light and cool for ${t}°`);
    else if (eff >= 18) out.push(`Comfortable at ${t}°`);
    else if (o.outer) out.push(`${['', 'Light', 'Mid-weight', 'Warm'][o.outer.warmth || 2]} jacket for ${t}°`);
    else out.push(`Dressed for ${t}°`);

    if (wet) {
      const p = [];
      if (o.outer && o.outer.wp) p.push('jacket');
      if (o.shoes && o.shoes.wp) p.push('shoes');
      if (p.length) out.push(`Rain-proof ${p.join(' and ')} for the wet weather`);
    }

    const n = o.note || {};
    if (n.kind === 'neutral') out.push('Neutral colors that always go together');
    else if (n.kind === 'pop') out.push(`${n.a.name} stands out against the neutrals`);
    else if (n.kind === 'tone') out.push(`${n.a.name} and ${n.b.name} are close shades`);

  S.wxState = 'loading'; if (!S.wx) render();
  try {
    const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 9000);
    const r = await fetch(WX_URL, { signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error('http ' + r.status);
    const wx = Engine.parseForecast(await r.json());
    wx.date = todayStr();
    store.set('dressed.wx', JSON.stringify(wx));
    S.wx = wx; S.wxState = 'ready';
  } catch (e) {
    if (fresh) { S.wx = cached; S.wxState = 'ready'; }
    else { S.wx = Engine.estimateWeather(new Date()); S.wxState = 'offline'; }
  }
  S.ov = null; recompute(); render();
}
function curWx() {
  if (!S.wx) return null;
  if (!S.ov) return S.wx;
  return { ...S.wx, source: 'manual', fMin: S.ov.feels, fMax: S.ov.feels, wet: S.ov.cond !== 'dry', snow: S.ov.cond === 'snow', wind: 0, rain: S.ov.cond === 'dry' ? 0 : 100 };
}

/* ---------- derived data ---------- */
function allTags() {
  const m = new Map();
  for (const it of S.items) for (const t of it.tags || []) m.set(t, (m.get(t) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(e => e[0]);
}
function recompute() {
  const wx = curWx();
  if (!wx) { S.sug = null; return; }
  S.sug = Engine.suggest({
    items: S.items, history: S.history.filter(h => h.date !== todayStr()), weather: wx, tag: S.tag,
    seed: Engine.dayNum(todayStr()) * 7 + S.shuffle, today: todayStr()
  });
  S.idx = 0; S.swaps = {};
}
function todaysOutfit() {
  const h = S.history.find(x => x.date === todayStr());
  if (!h) return null;
  const items = h.ids.map(id => S.items.find(i => i.id === id)).filter(Boolean);
  return items.length ? { rec: h, items } : null;
}
function dayLabel(d) {
  const t = todayStr(), y = Engine.dateStr(new Date(Date.now() - 86400000));
  if (d === t) return 'Today';
  if (d === y) return 'Yesterday';
  const [Y, M, D] = d.split('-').map(Number);
  return new Date(Y, M - 1, D).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

/* ---------- views ---------- */
const ACC_ORDER = ['earrings', 'necklace', 'ring', 'bracelet', 'watch', 'belt', 'scarf', 'hat', 'other'];
const lookItems = o => S.swaps[o.key] || o.items;
// Flat-lay board: clothes in two columns, small pieces in a row underneath. variant 1 mirrors it.
function board(items, variant, mini) {
  const by = c => items.filter(i => i.category === c);
  const [dress] = by('dress'), [top] = by('top'), [bottom] = by('bottom'), [outer] = by('outer'), [shoes] = by('shoes');
  const accs = by('acc');
  const bag = accs.find(a => subOf(a) === 'bag');
  const rest = accs.filter(a => a !== bag).sort((a, b) => ACC_ORDER.indexOf(subOf(a)) - ACC_ORDER.indexOf(subOf(b)));
  const slot = (it, f = 1) => (it ? `<div class="slot ${hasCut(it) ? '' : 'photo'}" style="flex:${f}"><img src="${imgOf(it, mini)}" alt="${mini ? '' : esc(Engine.labelOf(it))}"></div>` : '');
  const left = dress ? slot(dress, 1) : slot(top, 1.05) + slot(bottom, 1.5);
  const rightIts = [[outer, 1.3], [shoes, .8], [bag, .9]].filter(x => x[0]);
  if (rightIts.length < 2 && rest.length > 3) rightIts.push([rest.shift(), .6]);
  const right = rightIts.map(x => slot(x[0], x[1])).join('');
  const row = rest.slice(0, 5).map(a => slot(a)).join('');
  return `<div class="board ${mini ? 'mini' : ''}" role="img" aria-label="${mini ? 'Outfit preview' : esc(Engine.describe(items))}">
    <div class="b-main ${variant % 2 ? 'flip' : ''}"><div class="b-col ${right ? 'wide' : ''}">${left}</div>${right ? `<div class="b-col">${right}</div>` : ''}</div>
    ${row ? `<div class="b-acc">${row}</div>` : ''}</div>`;
}
const kindOf = it => (it.category === 'acc' ? SUB[subOf(it)].label : CAT[it.category].one);

function hairHTML(items) {
  const wx = curWx(); if (!wx) return '';
  const all = Engine.hairIdeas({ items, weather: wx, hair: S.hair, seed: Engine.dayNum(todayStr()), count: 18 });
  if (!all.length) return '';
  const start = (S.hairPage * 3) % all.length, pick = [];
  for (let i = 0; i < Math.min(3, all.length); i++) pick.push(all[(start + i) % all.length]);
  return `<section><div class="sect-h"><h3>Hair to go with it</h3>${all.length > 3 ? '<button class="link" data-act="hair-more">Show others</button>' : ''}</div>
    <div class="hair">${pick.map(h => `<div class="hair-c"><span class="why1">${esc(h.why)}</span><h4>${esc(h.name)}</h4><p>${esc(h.how)}</p>
      <a href="https://www.pinterest.com/search/pins/?q=${encodeURIComponent(h.name + ' hairstyle')}" target="_blank" rel="noopener">See photos on Pinterest</a></div>`).join('')}</div>
    <p class="cap-f">Based on ${esc(S.hair.length)} ${esc(S.hair.type)} hair. You can change this in Settings.</p></section>`;
}

function weatherCard() {
  const wx = curWx();
  if (!wx) return `<section class="card wx" aria-label="Weather"><div class="sk"></div><p class="foot">Checking Copenhagen weather</p></section>`;
  const eff = Math.round(Engine.effectiveTemp(wx));
  let big, cond, icon;
  if (S.ov) { big = S.ov.feels; cond = { dry: 'Dry', rain: 'Rain', snow: 'Snow' }[S.ov.cond]; icon = S.ov.cond === 'snow' ? 'snow' : S.ov.cond === 'rain' ? 'rain' : 'sun'; }
  else if (wx.source === 'estimate') { big = Math.round((wx.fMin + wx.fMax) / 2); cond = `Typical for ${wx.month}`; icon = 'cloud'; }
  else { big = Math.round(wx.temp); cond = wx.label; icon = wx.icon; }
  let sub = '';
  if (wx.source === 'live') {
    sub = `<div class="wx-sub">Feels ${eff}° · H ${Math.round(wx.hi)}° L ${Math.round(wx.lo)}°</div>` +
      `<div class="wx-sub">Rain ${Math.round(wx.rain)}% · Wind ${Math.round(wx.wind)} m/s</div>`;
  } else if (wx.source === 'estimate') {
    sub = `<div class="wx-sub">H ${Math.round(wx.hi)}° L ${Math.round(wx.lo)}°</div>`;
  }
  let note;
  if (S.ov) note = 'Set by you';
  else if (wx.source === 'estimate') note = "Can't reach the forecast, so this is a typical day. Tap Edit to set today's weather.";
  else note = `Copenhagen · updated ${hhmm(wx.updated)}`;
  const edit = S.wxEdit ? `
    <div class="wx-edit">
      <div class="row-between"><span>Feels like</span>
        <div class="stepper"><button data-act="wx-dec" aria-label="Colder">&minus;</button><b>${S.ov ? S.ov.feels : eff}°</b><button data-act="wx-inc" aria-label="Warmer">+</button></div></div>
      <div class="seg" role="group" aria-label="Conditions">${['dry', 'rain', 'snow'].map(c =>
        `<button data-act="wx-cond" data-c="${c}" aria-pressed="${(S.ov ? S.ov.cond : wx.snow ? 'snow' : wx.wet ? 'rain' : 'dry') === c}">${{ dry: 'Dry', rain: 'Rain', snow: 'Snow' }[c]}</button>`).join('')}</div>
      ${S.ov && S.wxState !== 'offline' ? '<button class="btn plain" data-act="wx-reset">Use the forecast</button>' : ''}
    </div>` : '';
  return `<section class="card wx" aria-label="Weather">
    <div class="wx-top"><div class="wx-temp">${big}°</div><div class="wx-txt"><div class="wx-cond">${esc(cond)}</div>${sub}</div><div class="wx-ic">${ic(icon)}</div></div>
    <div class="wx-foot"><p class="foot">${esc(note)}</p>
      <span>${S.wxState === 'offline' ? '<button class="link" data-act="wx-retry">Try again</button> ' : ''}<button class="link" data-act="wx-edit">${S.wxEdit ? 'Done' : 'Edit'}</button></span></div>
    ${edit}</section>`;
}

function render() {
  const v = $('#view');

  v.classList.toggle('has-bar', !!v.querySelector('.actionbar'));

  });

/* ---------- sheets ---------- */
let pushed = false;
function showSheet(html, keepScroll) {
  const r = $('#sheetRoot');
  let sh = r.querySelector('.sheet');
  if (!sh) {
    r.innerHTML = '<div class="scrim" data-act="sheet-close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="grab"></div><div class="sheet-in"></div></section>';
    sh = r.querySelector('.sheet'); void sh.offsetWidth;
  }
  r.classList.add('open'); document.body.classList.add('lock');
  if (!pushed) { try { history.pushState({ sheet: 1 }, ''); pushed = true; } catch (e) { /* fine */ } }
  const inn = sh.querySelector('.sheet-in'), st = sh.scrollTop;
  inn.innerHTML = html; sh.scrollTop = keepScroll ? st : 0;
}
function freeE() { if (E) { if (E.url) URL.revokeObjectURL(E.url); if (E.cutUrl) URL.revokeObjectURL(E.cutUrl); } E = null; }
function closeSheet(fromPop) {
  const r = $('#sheetRoot');
  if (!r.querySelector('.sheet')) return;
  r.classList.remove('open'); document.body.classList.remove('lock');
  setTimeout(() => { if (!r.classList.contains('open')) r.innerHTML = ''; }, 340);
  if (!fromPop && pushed) { pushed = false; try { history.back(); } catch (e) { /* fine */ } } else pushed = false;
  S.queue = []; freeE();
}
window.addEventListener('popstate', () => { if (pushed) { pushed = false; closeSheet(true); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !E) closeSheet(); });

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

function addMenu() {

async function startAdd(files) {
  files = [...files]; if (!files.length) return;
  showSheet(`<div class="busy"><p>Getting your photos ready</p><span class="foot" id="busyN">0 of ${files.length}</span></div>`);
  const ok = []; let failed = 0;
  for (let i = 0; i < files.length; i++) {
    try { ok.push(await prepare(files[i])); } catch (e) { failed++; }
    const n = $('#busyN'); if (n) n.textContent = `${i + 1} of ${files.length}`;
  }
  if (!ok.length) { closeSheet(); toast("Couldn't read those photos"); return; }
  if (failed) toast(`${failed} photo${failed > 1 ? 's' : ''} couldn't be read`);
  S.queue = ok; S.queueTotal = ok.length; S.lastCat = null;
  nextInQueue();
}
function newE(p, pos) {
  // photos usually come in batches of the same kind, so start from the last type picked
  const cat = S.lastCat || (S.cat !== 'all' ? S.cat : 'top');
  freeE();
  E = { mode: 'add', id: uid(), photo: p.blob, thumb: p.thumb, url: URL.createObjectURL(p.blob), name: '', category: cat, color: p.color, autoColor: true,
        warmth: DEFAULT_WARMTH[cat], warmTouched: false, wp: false, tags: [], fav: false, wash: false, pos, total: S.queueTotal, addedAt: Date.now(),
        sub: S.lastSub || '', metal: S.lastMetal || 'gold', cut: p.cut || null, cutThumb: p.cutThumb || null, cutOn: !!p.cut, cutUrl: p.cut ? URL.createObjectURL(p.cut) : '',
        strength: 'medium', busy: false };
}
function nextInQueue() {
  const p = S.queue.shift();
  if (!p) { closeSheet(); return; }
  newE(p, S.queueTotal - S.queue.length);
  renderEditor(false);
}
function openEdit(id) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  freeE();
  E = { mode: 'edit', id: it.id, photo: it.photo, thumb: it.thumb, url: URL.createObjectURL(it.photo), name: it.name || '', category: it.category, color: it.color,
        autoColor: false, warmth: it.warmth || 2, warmTouched: true, wp: !!it.wp, tags: [...(it.tags || [])], fav: !!it.fav, wash: !!it.wash, pos: 1, total: 1, addedAt: it.addedAt,
        sub: it.category === 'acc' ? subOf(it) : '', metal: it.metal || 'gold', cut: it.cut || null, cutThumb: it.cutThumb || null, cutOn: !!(it.cutOn && it.cut),
        cutUrl: it.cut ? URL.createObjectURL(it.cut) : '', strength: 'medium', busy: false };
  renderEditor(false);
}
function renderEditor(keep) { showSheet(editorHTML(), keep); }

function editorHTML() {
  const e = E, cat = e.category, c = COLOR[e.color] || COLORS[0], used = allTags();
  const title = e.mode === 'edit' ? 'Edit item' : e.total > 1 ? `Item ${e.pos} of ${e.total}` : 'New item';
  const cancel = e.mode === 'add' && e.total > 1 ? 'Stop' : 'Cancel';
  const sugg = (used.length ? used : ['school', 'weekend', 'party']).filter(t => !e.tags.includes(t)).slice(0, 8);
  const wsel = ['Light', 'Medium', 'Warm'].map((l, i) => `<button data-act="ed-warm" data-v="${i + 1}" aria-pressed="${e.warmth === i + 1}">${l}</button>`).join('');
  const sw = (k, label, sub, on) => `<div class="row"><span class="grow">${label}${sub ? `<small>${sub}</small>` : ''}</span><button class="sw" role="switch" aria-checked="${on}" aria-label="${label}" data-act="ed-toggle" data-k="${k}"></button></div>`;
  const subInfo = cat === 'acc' && e.sub ? SUB[e.sub] : null;
  let rows = '';
  if (cat === 'outer') rows += sw('wp', 'Rain-proof', 'Used on wet days', e.wp);
  if (cat === 'shoes') rows += sw('wp', 'Waterproof', 'Used on wet days', e.wp);
  rows += sw('cut', 'Remove background', 'Makes the piece look like a cutout on your outfit board', e.cutOn);
  rows += sw('fav', 'Favorite', '', e.fav) + sw('wash', 'In the wash', 'Left out of outfit ideas until you switch it off', e.wash);
  const skipBtn = e.mode === 'add' && S.queue.length ? '<button class="btn plain" data-act="ed-skip">Skip this photo</button>' : '';
  const delBtn = e.mode === 'edit' ? `<button class="btn tint block danger" data-act="ed-delete">${e.confirmDel ? 'Tap again to delete' : 'Delete item'}</button>` : '';
  const showColor = !(subInfo && subInfo.group === 'jewel');
  const preview = e.cutOn && e.cutUrl ? `<img class="cutv" src="${e.cutUrl}" alt="Cutout of this item">` : `<img src="${e.url}" alt="Photo of this item">`;
  return `<div class="sheet-h"><button class="btn plain" data-act="ed-cancel">${cancel}</button><h3>${title}</h3><button class="btn plain strong" data-act="ed-save">Save</button></div>
  <div class="sheet-b">
    <div class="photo">${preview}${e.busy ? '<div class="spin">Removing background</div>' : ''}<button class="chip" data-act="ed-photo">${ic('camera', 'sm')} Change photo</button></div>
    <section><input id="ed-name" class="field" type="text" placeholder="Name (optional)" maxlength="40" value="${esc(e.name)}" autocomplete="off"></section>
    <section><p class="cap-h">Type</p><div class="chips wrap">${CATS.map(k => `<button class="chip ${k.id === cat ? 'on' : ''}" data-act="ed-cat" data-v="${k.id}">${k.one}</button>`).join('')}</div></section>
    ${cat === 'acc' ? `<section><p class="cap-h">What is it?</p><div class="chips wrap">${SUBS.filter(x => x.id !== 'other').map(x => `<button class="chip ${x.id === e.sub ? 'on' : ''}" data-act="ed-sub" data-v="${x.id}">${x.label}</button>`).join('')}</div>
      ${e.sub ? '' : '<p class="cap-f">Pick one so it is used in the right place.</p>'}</section>` : ''}
    ${subInfo && subInfo.metal ? `<section><p class="cap-h">Metal</p><div class="seg" role="group" aria-label="Metal">${[['gold', 'Gold'], ['silver', 'Silver'], ['none', 'Other']].map(([v, l]) =>
      `<button data-act="ed-metal" data-v="${v}" aria-pressed="${e.metal === v}">${l}</button>`).join('')}</div><p class="cap-f">Gold and silver pieces are not mixed in one outfit.</p></section>` : ''}
    ${showColor ? `<section><p class="cap-h">Color: ${c.name}</p><div class="group"><div class="swatches">${COLORS.map(k =>
      `<button class="sw-c ${k.id === e.color ? 'on' : ''}" data-act="ed-color" data-v="${k.id}" style="--c:${k.hex}" aria-label="${k.name}" aria-pressed="${k.id === e.color}"></button>`).join('')}</div></div>
      ${e.autoColor ? '<p class="cap-f">Picked from your photo. Tap another color if it is wrong.</p>' : ''}</section>` : ''}
    ${HINTS[cat] ? `<section><p class="cap-h">How warm is it?</p><div class="seg" role="group" aria-label="Warmth">${wsel}</div><p class="cap-f">${HINTS[cat]}</p></section>` : ''}
    <section><p class="cap-h">Tags</p>
      <div class="tagbox">${e.tags.map(t => `<span class="tag">${esc(t)}<button data-act="tag-del" data-v="${esc(t)}" aria-label="Remove ${esc(t)}">${ic('x', 'sm')}</button></span>`).join('')}
        <input id="ed-tag" type="text" placeholder="${e.tags.length ? 'Add another' : 'school, party, cozy…'}" maxlength="24" enterkeyhint="done" autocomplete="off"></div>
      ${sugg.length ? `<div class="chips wrap sugg">${sugg.map(t => `<button class="chip" data-act="tag-quick" data-v="${esc(t)}">${ic('plus', 'sm')} ${esc(t)}</button>`).join('')}</div>` : ''}</section>
    <section><div class="group">${rows}</div>
      ${e.cutOn ? `<div class="seg" style="margin-top:12px" role="group" aria-label="How much to remove">${['gentle', 'medium', 'strong'].map(v => `<button data-act="ed-strength" data-v="${v}" aria-pressed="${e.strength === v}">${v[0].toUpperCase() + v.slice(1)}</button>`).join('')}</div>
        <p class="cap-f">If part of the item disappears, try Gentle. If background is left, try Strong.</p>` : ''}</section>
    ${skipBtn}${delBtn}
  </div>`;
}

// Re-runs the background removal on the saved photo.
async function recut(strength) {
  const e = E; if (!e) return;
  e.busy = true; renderEditor(true);
  let res = null;
  try { const img = await decode(e.photo); res = await makeCut(img, strength); if (img.close) img.close(); } catch (err) { res = null; }
  if (E !== e) return;
  e.busy = false;
  if (res) {
    if (e.cutUrl) URL.revokeObjectURL(e.cutUrl);
    e.cut = res.cut; e.cutThumb = res.cutThumb; e.cutUrl = URL.createObjectURL(res.cut); e.cutOn = true; e.strength = strength;
  } else { e.cutOn = !!e.cut && e.cutOn; toast("Couldn't find the background. A plain surface works best."); }
  renderEditor(true);
}

function addTag(raw) {
  const t = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' ').slice(0, 24);
  if (t && !E.tags.includes(t) && E.tags.length < 12) E.tags.push(t);
}

async function saveEditor() {
  const tg = $('#ed-tag'); if (tg && tg.value.trim()) addTag(tg.value);
  const cat = E.category;
  const sub = cat === 'acc' ? (E.sub || 'other') : undefined;
  const warmth = cat === 'acc' ? (SUB[sub].group === 'warm' ? 3 : 1) : E.warmth;
  const it = { id: E.id, name: E.name.trim(), category: cat, color: E.color, warmth, wp: (cat === 'outer' || cat === 'shoes') && !!E.wp,
               tags: [...E.tags], fav: !!E.fav, wash: !!E.wash, photo: E.photo, thumb: E.thumb, addedAt: E.addedAt || Date.now(),
               sub, metal: sub && SUB[sub].metal ? E.metal : undefined, cut: E.cut || undefined, cutThumb: E.cutThumb || undefined, cutOn: !!(E.cutOn && E.cut) };
  try { await DB.put('items', it); } catch (err) { toast("Couldn't save. Is the device storage full?"); return; }
  const i = S.items.findIndex(x => x.id === it.id);
  if (i >= 0) S.items[i] = it; else S.items.push(it);
  const adding = E.mode === 'add';
  if (adding) { S.lastCat = cat; S.lastSub = sub || ''; if (it.metal) S.lastMetal = it.metal; }
  if (adding && S.items.length === 1) persistStorage();
  if (adding && S.queue.length) { nextInQueue(); }
  else { const total = S.queueTotal; closeSheet(); toast(adding ? (total > 1 ? `Added ${total} items` : 'Added to your wardrobe') : 'Saved'); }
  recompute(); render();
}

async function persistStorage() {
  try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) { /* ignore */ }
}

/* ---------- backup ---------- */
async function exportData() {
  try {
    const items = [];
    for (const it of S.items) items.push({ ...it, photo: await blobToDataURL(it.photo), thumb: it.thumb ? await blobToDataURL(it.thumb) : null, cut: it.cut ? await blobToDataURL(it.cut) : null, cutThumb: it.cutThumb ? await blobToDataURL(it.cutThumb) : null });
    const blob = new Blob([JSON.stringify({ app: 'dressed', version: 2, exportedAt: new Date().toISOString(), items, history: S.history })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `dressed-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    toast('Backup saved to your downloads');
  } catch (e) { toast("Couldn't make the backup"); }
}
async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'dressed' || !Array.isArray(data.items)) throw new Error('format');
    dropAllUrls();
    for (const raw of data.items) {
      const it = { ...raw, photo: dataURLToBlob(raw.photo), thumb: raw.thumb ? dataURLToBlob(raw.thumb) : dataURLToBlob(raw.photo), cut: raw.cut ? dataURLToBlob(raw.cut) : undefined, cutThumb: raw.cutThumb ? dataURLToBlob(raw.cutThumb) : undefined };
      await DB.put('items', it);
    }
    for (const h of data.history || []) await DB.put('history', h);
    S.items = await DB.all('items'); S.history = await DB.all('history');
    recompute(); render(); toast(`Restored ${data.items.length} item${data.items.length === 1 ? '' : 's'}`);
  } catch (e) { toast("That file isn't a Dressed backup"); }
}

/* ---------- actions ---------- */
const A = {
  tab(el) { S.tab = el.dataset.tab; S.confirmReset = false; window.scrollTo(0, 0); render(); },
  'hair-more'() { S.hairPage++; render(); },
  'hair-len'(el) { S.hair.length = el.dataset.v; store.set('dressed.hair', JSON.stringify(S.hair)); S.hairPage = 0; render(); },
  'hair-type'(el) { S.hair.type = el.dataset.v; store.set('dressed.hair', JSON.stringify(S.hair)); S.hairPage = 0; render(); },
  'swap-reset'() { const o = S.sug.list[S.idx]; delete S.swaps[o.key]; render(); },
  swap(el) {
    const o = S.sug.list[S.idx], items = lookItems(o), i = +el.dataset.i, cur = items[i]; if (!cur) return;
    S.swapCtx = { key: o.key, i };
    const alts = S.items.filter(x => !x.wash && x.category === cur.category && x.id !== cur.id && !items.some(y => y.id === x.id) && (cur.category !== 'acc' || subOf(x) === subOf(cur)));
    showSheet(`<div class="sheet-h"><span></span><h3>Swap ${esc(kindOf(cur).toLowerCase())}</h3><button class="btn plain strong" data-act="sheet-close">Done</button></div>
      ${cur.category === 'acc' ? '<div class="swap-top"><button class="btn tint sm" data-act="swap-remove">Leave it out</button></div>' : ''}
      ${alts.length ? `<div class="swap-g">${alts.map(x => `<button class="pin" data-act="swap-pick" data-id="${x.id}"><span class="ph ${hasCut(x) ? 'cut' : ''}"><img src="${imgOf(x, true)}" alt=""></span><span class="cap">${esc(Engine.labelOf(x))}</span></button>`).join('')}</div>`
        : '<div class="pick"><p class="foot">You have no other matching pieces yet. Add more in the Wardrobe tab.</p></div>'}`);
  },
  'swap-pick'(el) {
    const c = S.swapCtx, o = S.sug.list.find(x => x.key === c.key), it = S.items.find(x => x.id === el.dataset.id); if (!o || !it) return;
    const arr = [...lookItems(o)]; arr[c.i] = it; S.swaps[o.key] = arr; closeSheet(); render();
  },
  'swap-remove'() {
    const c = S.swapCtx, o = S.sug.list.find(x => x.key === c.key); if (!o) return;
    const arr = [...lookItems(o)]; arr.splice(c.i, 1); S.swaps[o.key] = arr; closeSheet(); render();
  },
  occ(el) { S.tag = el.dataset.tag || null; S.shuffle = 0; recompute(); render(); },
  opt(el) { S.idx = +el.dataset.i; render(); },
  shuffle() { S.shuffle++; recompute(); render(); },
  async approve() {
    const o = S.sug && S.sug.ok && S.sug.list[S.idx]; if (!o) return;
    const wx = curWx();
    const rec = { date: todayStr(), ids: lookItems(o).map(i => i.id), temp: Math.round(Engine.effectiveTemp(wx)), wet: !!wx.wet, at: Date.now() };
    await DB.put('history', rec);
    S.history = S.history.filter(h => h.date !== rec.date).concat(rec);
    render(); window.scrollTo(0, 0); toast('Saved to your diary');
  },
  async undo() { await DB.del('history', todayStr()); S.history = S.history.filter(h => h.date !== todayStr()); recompute(); render(); },
  'wx-edit'() { S.wxEdit = !S.wxEdit; render(); },
  'wx-dec'() { ovStep(-1); },
  'wx-inc'() { ovStep(1); },
  'wx-cond'(el) { const w = curWx(); S.ov = S.ov || { feels: Math.round(Engine.effectiveTemp(w)), cond: 'dry' }; S.ov.cond = el.dataset.c; recompute(); render(); },
  'wx-reset'() { S.ov = null; recompute(); render(); },
  'wx-retry'() { loadWeather(true); },
  'wx-refresh'() { toast('Checking the forecast'); loadWeather(true); },
  add() { addMenu(); },
  'add-lib'() { $('#fileLib').click(); },
  'add-cam'() { $('#fileCam').click(); },
  cat(el) { S.cat = el.dataset.cat; render(); },
  wtag(el) { S.wtag = el.dataset.tag || null; render(); },
  edit(el) { openEdit(el.dataset.id); },
  'sheet-close'() { if (!E) closeSheet(); },
  'ed-cancel'() { closeSheet(); },
  'ed-skip'() { nextInQueue(); },
  'ed-save'() { saveEditor(); },
  'ed-photo'() { $('#fileOne').click(); },
  'ed-cat'(el) { E.category = el.dataset.v; if (!E.warmTouched) E.warmth = DEFAULT_WARMTH[E.category]; renderEditor(true); },
  'ed-sub'(el) { E.sub = el.dataset.v; renderEditor(true); },
  'ed-metal'(el) { E.metal = el.dataset.v; renderEditor(true); },
  'ed-strength'(el) { recut(el.dataset.v); },
  'ed-color'(el) { E.color = el.dataset.v; E.autoColor = false; renderEditor(true); },
  'ed-warm'(el) { E.warmth = +el.dataset.v; E.warmTouched = true; renderEditor(true); },
  'ed-toggle'(el) {
    const k = el.dataset.k;
    if (k === 'cut') { if (E.cutOn) { E.cutOn = false; renderEditor(true); } else if (E.cut) { E.cutOn = true; renderEditor(true); } else recut(E.strength); return; }
    E[k] = !E[k];
    renderEditor(true);
  },
  'tag-del'(el) { E.tags = E.tags.filter(t => t !== el.dataset.v); renderEditor(true); },
  'tag-quick'(el) { addTag(el.dataset.v); renderEditor(true); },
  async 'ed-delete'() {
    if (!E.confirmDel) { E.confirmDel = true; renderEditor(true); return; }
    const id = E.id;
    await DB.del('items', id); S.items = S.items.filter(i => i.id !== id); dropUrls(id);
    closeSheet(); toast('Deleted'); recompute(); render();
  },
  'diary-open'(el) {
    const date = el.dataset.date, h = S.history.find(x => x.date === date); if (!h) return;
    const items = h.ids.map(id => S.items.find(i => i.id === id)).filter(Boolean);
    showSheet(`<div class="sheet-h"><span></span><h3>${esc(dayLabel(date))}</h3><button class="btn plain strong" data-act="sheet-close">Done</button></div>
      <div class="sheet-b">${board(items, 0)}
      <button class="btn tint block danger" data-act="diary-del" data-date="${date}">Remove from diary</button></div>`);
  },
  async 'diary-del'(el) {
    await DB.del('history', el.dataset.date); S.history = S.history.filter(h => h.date !== el.dataset.date);
    closeSheet(); recompute(); render(); toast('Removed');
  },
  accent(el) { store.set('dressed.accent', el.dataset.k); applyAccent(); render(); },
  export() { exportData(); },
  import() { $('#fileImport').click(); },
  async install() {
    const ev = S.installEvt; if (!ev) return;
    ev.prompt(); try { await ev.userChoice; } catch (e) { /* ignore */ }
    S.installEvt = null; render();
  },
  async reset() {
    if (!S.confirmReset) { S.confirmReset = true; render(); setTimeout(() => { if (S.confirmReset) { S.confirmReset = false; if (S.tab === 'settings') render(); } }, 4000); return; }
    await DB.clear('items'); await DB.clear('history'); dropAllUrls();
    S.items = []; S.history = []; S.swaps = {}; S.confirmReset = false; S.tag = null; S.cat = 'all'; S.wtag = null;
    recompute(); render(); toast('Everything deleted');
  }
};
function ovStep(d) {
  const w = curWx(); S.ov = S.ov || { feels: Math.round(Engine.effectiveTemp(w)), cond: w.snow ? 'snow' : w.wet ? 'rain' : 'dry' };
  S.ov.feels = Math.max(-25, Math.min(40, S.ov.feels + d)); recompute(); render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (E && act.startsWith('ed-') && act !== 'ed-delete') E.confirmDel = false;
  if (A[act]) A[act](el, e);
});
document.addEventListener('input', e => { if (E && e.target.id === 'ed-name') E.name = e.target.value; });
document.addEventListener('keydown', e => {
  if (E && e.target.id === 'ed-tag' && (e.key === 'Enter' || e.key === ',')) {
    e.preventDefault(); addTag(e.target.value); renderEditor(true);
    const t = $('#ed-tag'); if (t) t.focus();
  }
});
$('#fileLib').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; startAdd(f); });
$('#fileCam').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; startAdd(f); });
$('#fileOne').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !E) return;
  try {
    const p = await prepare(f); if (!E) return;
    if (E.url) URL.revokeObjectURL(E.url);
    E.photo = p.blob; E.thumb = p.thumb; E.url = URL.createObjectURL(p.blob);
    if (E.cutUrl) URL.revokeObjectURL(E.cutUrl);
    E.cut = p.cut || null; E.cutThumb = p.cutThumb || null; E.cutUrl = p.cut ? URL.createObjectURL(p.cut) : ''; E.cutOn = !!p.cut;
    if (E.autoColor) E.color = p.color;
    renderEditor(true);
  } catch (err) { toast("Couldn't read that photo"); }
});
$('#fileImport').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importData(f); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.tab === 'settings') render(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; if (S.tab === 'settings') render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.day !== todayStr()) { S.day = todayStr(); S.shuffle = 0; S.ov = null; S.wxEdit = false; loadWeather(true); }
  else if (S.wx && S.wx.source === 'live' && Date.now() - S.wx.updated > 45 * 60e3) loadWeather(true);
});

/* ---------- start ---------- */
(async function boot() {
  applyAccent();
  await DB.open();
  try { S.items = await DB.all('items'); S.history = await DB.all('history'); } catch (e) { S.items = []; S.history = []; }
  const dow = new Date().getDay();
  if (dow >= 1 && dow <= 5) { const t = allTags().find(x => x.includes('school')); if (t) S.tag = t; }
  try { if (navigator.storage && navigator.storage.persisted) S.persisted = await navigator.storage.persisted(); } catch (e) { /* ignore */ }
  render();
  loadWeather(false);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__dressed = { S, A, render, DB };
})();
})();

</script>
