<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dressed</title>
<meta name="description" content="Pick today's outfit from your own wardrobe.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dressed">
<link rel="manifest" href="manifest.json">

<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: one centered column, large-title pages, translucent tab bar, bottom sheets for editing. System fonts and iOS-style controls. */
:root {
  --bg: #f2f2f7; --card: #ffffff; --fill: rgba(120,120,128,.12); --fill-2: rgba(120,120,128,.2);
  --ink: #000000; --ink-2: rgba(60,60,67,.66); --ink-3: rgba(60,60,67,.32); --line: rgba(60,60,67,.16);
  --bar: rgba(247,247,250,.82); --seg-on: #ffffff; --shadow: 0 .5px 1px rgba(0,0,0,.05), 0 8px 28px rgba(0,0,0,.06);
  --accent-l: #0071e3; --accent-d: #0a84ff; --on-l: #ffffff; --on-d: #ffffff;
  --accent: var(--accent-l); --on-accent: var(--on-l);
  --red: #d70015; --green: #34c759;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI Variable Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabh: 56px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000; --card: #1c1c1e; --fill: rgba(120,120,128,.24); --fill-2: rgba(120,120,128,.38);
    --ink: #ffffff; --ink-2: rgba(235,235,245,.62); --ink-3: rgba(235,235,245,.3); --line: rgba(84,84,88,.6);
    --bar: rgba(24,24,26,.82); --seg-on: #636366; --shadow: none;
    --accent: var(--accent-d); --on-accent: var(--on-d); --red: #ff453a; --green: #30d158;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--font);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100dvh;
}
body.lock { overflow: hidden; }
button, input { font: inherit; color: inherit; }
a { color: var(--accent); }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.fill { fill: currentColor; }
.ic.sm { width: 18px; height: 18px; }
.ic.lg { width: 34px; height: 34px; stroke-width: 1.5; }

.app {
  max-width: 600px; margin: 0 auto; padding-block: max(14px, env(safe-area-inset-top)) 0;
  padding-inline: max(16px, env(safe-area-inset-left)) max(16px, env(safe-area-inset-right));
}
.view { padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 32px); display: grid; gap: 14px; align-content: start; }
.view.has-bar { padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 96px); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 6px; }
.head > div { min-width: 0; }
.eyebrow { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
h1 { margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: -.022em; text-wrap: balance; }
h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; }
.foot { margin: 0; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
.cap-h { margin: 0 0 8px 16px; font-size: 13px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; color: var(--ink-2); }
.cap-f { margin: 8px 16px 0; font-size: 13px; color: var(--ink-2); }

.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); }
.card.pad { padding: 12px; }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 22px;
  border: 0; border-radius: 14px; font-size: 17px; font-weight: 600; letter-spacing: -.01em; transition: opacity .15s, transform .15s;
}
.btn:active { opacity: .7; transform: scale(.985); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.tint { background: var(--fill); color: var(--accent); }
.btn.plain { background: transparent; color: var(--accent); min-height: 44px; padding: 0 12px; }
.btn.danger { color: var(--red); }
.btn.block { width: 100%; }
.btn.grow { flex: 1; }
.round { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); flex: none; }
.round:active { opacity: .7; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-size: 15px; font-weight: 500; }

/* chips + segmented control */
.chips { position: relative; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; margin: 0; padding: 0; }
.chip { flex: none; border: 0; background: var(--fill); border-radius: 999px; min-height: 36px; padding: 6px 14px; font-size: 15px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--on-accent); }
.chip small { opacity: .6; font-size: 13px; margin-left: 4px; }
.seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 7px 8px; font-size: 14px; font-weight: 500; min-height: 34px; }
.seg button[aria-selected="true"], .seg button[aria-pressed="true"] { background: var(--seg-on); font-weight: 600; box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 .5px 1px rgba(0,0,0,.1); }
.sect-label { margin: 0 0 8px; font-size: 13px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }

/* weather */
.wx { padding: 16px 18px 10px; display: grid; gap: 8px; }
.wx-top { display: flex; align-items: center; gap: 14px; }
.wx-temp { font-size: 56px; line-height: 1; font-weight: 300; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.wx-txt { flex: 1; min-width: 0; }
.wx-cond { font-size: 17px; font-weight: 600; line-height: 1.25; }
.wx-sub { font-size: 13.5px; line-height: 1.4; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.wx-ic { color: var(--accent); flex: none; }
.wx-ic .ic { width: 44px; height: 44px; stroke-width: 1.5; }
.wx-foot { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.wx-foot > span { flex: none; display: inline-flex; gap: 16px; }
.wx-foot .foot { padding-top: 4px; }
.wx-edit { display: grid; gap: 12px; padding-top: 12px; border-top: .5px solid var(--line); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; background: var(--fill); border-radius: 12px; }
.stepper button { width: 46px; height: 40px; border: 0; background: transparent; font-size: 22px; font-weight: 500; color: var(--accent); }
.stepper b { min-width: 52px; text-align: center; font-size: 18px; font-variant-numeric: tabular-nums; }
.sk { height: 88px; border-radius: 14px; background: linear-gradient(90deg, var(--fill), var(--fill-2), var(--fill)); background-size: 200% 100%; animation: sh 1.3s linear infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* outfit */
.outfit { display: grid; gap: 12px; }
.collage { display: grid; gap: 8px; grid-template-columns: repeat(2, 1fr); }
.collage.c3 { grid-template-columns: repeat(3, 1fr); }
.tile { position: relative; margin: 0; border-radius: 14px; overflow: hidden; background: var(--fill); aspect-ratio: 4 / 5; }
.c3 .tile { aspect-ratio: 3 / 4; }
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.tile figcaption { position: absolute; inset: auto 0 0 0; padding: 24px 9px 7px; font-size: 12px; font-weight: 600; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.58)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.why { list-style: none; margin: 14px 4px 4px; padding: 0; display: grid; gap: 7px; }
.why li { display: flex; gap: 10px; font-size: 15px; line-height: 1.35; color: var(--ink-2); }
.why li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 8px; border-radius: 50%; background: var(--accent); }
.done-h { display: flex; align-items: center; gap: 8px; margin: 2px 4px 12px; font-weight: 600; font-size: 17px; }
.done-h .ic { color: var(--green); }
.actionbar { position: fixed; inset: auto 0 calc(var(--tabh) + env(safe-area-inset-bottom)) 0; z-index: 20; padding: 10px 16px; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); }
.actionbar .in { max-width: 600px; margin: 0 auto; display: flex; gap: 10px; }

/* wardrobe */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px; }
@media (min-width: 520px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.it { display: grid; gap: 6px; padding: 0; border: 0; background: none; text-align: left; align-content: start; }
.ph { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: var(--fill); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.it.wash .ph img { opacity: .4; }
.dot { position: absolute; right: 7px; bottom: 7px; width: 15px; height: 15px; border-radius: 50%; box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 1px 3px rgba(0,0,0,.3); }
.badge { position: absolute; left: 6px; top: 6px; background: rgba(0,0,0,.62); color: #fff; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.star { position: absolute; right: 6px; top: 6px; color: #ffd60a; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
.star .ic { width: 18px; height: 18px; }
.cap { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* grouped lists */
.group { background: var(--card); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 50px; padding: 10px 16px; border: 0; background: none; text-align: left; border-bottom: .5px solid var(--line); font-size: 17px; }
.group > :last-child { border-bottom: 0; }
.row .grow { flex: 1; min-width: 0; }
.row small { display: block; font-size: 13px; color: var(--ink-2); margin-top: 1px; }
.row .val { color: var(--ink-2); font-size: 17px; }
button.row:active { background: var(--fill); }
.row.danger { color: var(--red); }
.sw { position: relative; flex: none; width: 51px; height: 31px; border: 0; border-radius: 999px; background: var(--fill-2); transition: background .2s; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.25); transition: transform .2s; }
.sw[aria-checked="true"] { background: var(--green); }
.sw[aria-checked="true"]::after { transform: translateX(20px); }
.thumbs { display: flex; gap: 6px; flex: none; }
.thumbs img { width: 36px; height: 46px; object-fit: cover; border-radius: 7px; background: var(--fill); }
.drow { min-height: 66px; }
.accents { display: flex; gap: 14px; padding: 14px 16px; flex-wrap: wrap; }
.acc { width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--c); position: relative; }
.acc.on::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--ink-2); }

/* empty states */
.empty { display: grid; justify-items: center; gap: 10px; text-align: center; padding: 36px 20px; }
.empty .badge-ic { width: 76px; height: 76px; border-radius: 50%; display: grid; place-items: center; background: var(--fill); color: var(--accent); margin-bottom: 4px; }
.empty p { margin: 0; color: var(--ink-2); max-width: 32ch; }
.empty h2 { font-size: 22px; }

/* tab bar */
.tabs { position: fixed; inset: auto 0 0 0; z-index: 30; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabs .in { max-width: 600px; margin: 0 auto; display: flex; height: var(--tabh); }
.tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; color: var(--ink-2); font-size: 10.5px; font-weight: 500; }
.tabs button.on { color: var(--accent); }
.tabs .ic { width: 26px; height: 26px; }

/* bottom sheet */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .25s; z-index: 50; }
.sheet { position: fixed; inset: auto 0 0 0; z-index: 51; margin: 0 auto; max-width: 600px; max-height: 94dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); border-radius: 22px 22px 0 0; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
#sheetRoot.open .scrim { opacity: 1; }
#sheetRoot.open .sheet { transform: none; }
.grab { width: 38px; height: 5px; border-radius: 3px; background: var(--ink-3); margin: 8px auto 0; }
.sheet-h { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 8px 8px; background: var(--bg); }
.sheet-h h3 { margin: 0; font-size: 17px; font-weight: 600; }
.sheet-h button:last-child { justify-self: end; }
.sheet-h .strong { font-weight: 700; }
.sheet-b { display: grid; gap: 22px; padding: 6px 16px 28px; }
.photo { position: relative; aspect-ratio: 1; max-height: 42dvh; width: min(100%, 42dvh); margin: 0 auto; border-radius: 18px; overflow: hidden; background: var(--fill); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo .chip { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.6); color: #fff; }
.field { width: 100%; border: 0; border-radius: 12px; background: var(--card); padding: 13px 16px; font-size: 17px; }
.field::placeholder { color: var(--ink-3); }
.swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px 10px; padding: 16px; }
.sw-c { aspect-ratio: 1; border: 0; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px rgba(128,128,128,.45); position: relative; }
.sw-c.on::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; box-shadow: 0 0 0 2.5px var(--accent); }
.tagbox { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card); border-radius: 12px; padding: 10px 12px; }
.tag { display: inline-flex; align-items: center; gap: 2px; background: var(--fill); border-radius: 999px; padding: 4px 4px 4px 12px; font-size: 15px; font-weight: 500; }
.tag button { border: 0; background: none; width: 26px; height: 26px; display: grid; place-items: center; color: var(--ink-2); }
.tagbox input { flex: 1; min-width: 110px; border: 0; background: none; font-size: 17px; padding: 6px 4px; outline: none; }
.tagbox input::placeholder { color: var(--ink-3); }
.sugg { margin-top: 10px; }
.busy { padding: 56px 20px 64px; text-align: center; display: grid; gap: 8px; }
.busy p { margin: 0; font-size: 17px; font-weight: 600; }
.pick { display: grid; gap: 12px; padding: 4px 16px 24px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--tabh) + env(safe-area-inset-bottom) + 84px); transform: translate(-50%, 16px); z-index: 80; max-width: calc(100% - 32px); background: rgba(44,44,46,.94); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 15px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; text-align: center; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>

<script>
/* engine.js: colors, weather helpers and outfit suggestions. No DOM in here, so it can be tested on its own. */
const Engine = (() => {
  const CATS = [
    { id: 'top',    label: 'Tops',        one: 'Top' },
    { id: 'bottom', label: 'Bottoms',     one: 'Bottom' },
    { id: 'dress',  label: 'Dresses',     one: 'Dress' },
    { id: 'outer',  label: 'Jackets',     one: 'Jacket' },
    { id: 'shoes',  label: 'Shoes',       one: 'Shoes' },
    { id: 'acc',    label: 'Accessories', one: 'Accessory' }
  ];
  const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

  // hue is in degrees for colors that count as "colors"; null for neutrals (they go with everything)
  const COLORS = [
    { id: 'black',    name: 'Black',    hex: '#1c1c1e', hue: null },
    { id: 'white',    name: 'White',    hex: '#f4f4f0', hue: null },
    { id: 'grey',     name: 'Grey',     hex: '#8e8e93', hue: null },
    { id: 'cream',    name: 'Cream',    hex: '#eadfc8', hue: null },
    { id: 'tan',      name: 'Tan',      hex: '#c19a6b', hue: null },
    { id: 'brown',    name: 'Brown',    hex: '#6f4a2f', hue: null },

/* ---------- weather ---------- */
const WX_URL = 'https://api.open-meteo.com/v1/forecast?latitude=55.68&longitude=12.57' +
  '&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m' +
  '&daily=temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,weather_code,wind_speed_10m_max' +
  '&timezone=Europe%2FCopenhagen&forecast_days=1&wind_speed_unit=ms';
const hhmm = t => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

async function loadWeather(force) {
  let cached = null;
  try { cached = JSON.parse(store.get('dressed.wx') || 'null'); } catch (e) { /* ignore */ }
  const fresh = cached && cached.date === todayStr();
  if (!force && fresh && Date.now() - cached.updated < 45 * 60e3) { S.wx = cached; S.wxState = 'ready'; recompute(); render(); return; }
  S.wxState = 'loading'; if (!S.wx) render();
  try {
    const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 9000);
    const r = await fetch(WX_URL, { signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error('http ' + r.status);
    const wx = Engine.parseForecast(await r.json());
    wx.date = todayStr();
    store.set('dressed.wx', JSON.stringify(wx));
    S.wx = wx; S.wxState = 'ready';
  } catch (e) {
    if (fresh) { S.wx = cached; S.wxState = 'ready'; }
    else { S.wx = Engine.estimateWeather(new Date()); S.wxState = 'offline'; }
  }
  S.ov = null; recompute(); render();
}
function curWx() {
  if (!S.wx) return null;
  if (!S.ov) return S.wx;
  return { ...S.wx, source: 'manual', fMin: S.ov.feels, fMax: S.ov.feels, wet: S.ov.cond !== 'dry', snow: S.ov.cond === 'snow', wind: 0, rain: S.ov.cond === 'dry' ? 0 : 100 };
}

/* ---------- derived data ---------- */
function allTags() {
  const m = new Map();
  for (const it of S.items) for (const t of it.tags || []) m.set(t, (m.get(t) || 0) + 1);
  return [...m.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(e => e[0]);
}
function recompute() {
  const wx = curWx();
  if (!wx) { S.sug = null; return; }
  S.sug = Engine.suggest({
    items: S.items, history: S.history.filter(h => h.date !== todayStr()), weather: wx, tag: S.tag,
    seed: Engine.dayNum(todayStr()) * 7 + S.shuffle, today: todayStr()
  });
  S.idx = 0;
}
function todaysOutfit() {
  const h = S.history.find(x => x.date === todayStr());
  if (!h) return null;
  const items = h.ids.map(id => S.items.find(i => i.id === id)).filter(Boolean);
  return items.length ? { rec: h, items } : null;
}
function dayLabel(d) {
  const t = todayStr(), y = Engine.dateStr(new Date(Date.now() - 86400000));
  if (d === t) return 'Today';
  if (d === y) return 'Yesterday';
  const [Y, M, D] = d.split('-').map(Number);
  return new Date(Y, M - 1, D).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}

/* ---------- views ---------- */
function collage(items) {
  const n = items.length, cols = n === 3 || n >= 5 ? 'c3' : 'c2';
  return `<div class="collage ${cols}">${items.map(it => {
    const l = esc(Engine.labelOf(it));
    return `<figure class="tile"><img src="${urlsFor(it).photo}" alt="${l}"><figcaption>${l}</figcaption></figure>`;
  }).join('')}</div>`;
}

function weatherCard() {
  const wx = curWx();
  if (!wx) return `<section class="card wx" aria-label="Weather"><div class="sk"></div><p class="foot">Checking Copenhagen weather</p></section>`;
  const eff = Math.round(Engine.effectiveTemp(wx));
  let big, cond, icon;
  if (S.ov) { big = S.ov.feels; cond = { dry: 'Dry', rain: 'Rain', snow: 'Snow' }[S.ov.cond]; icon = S.ov.cond === 'snow' ? 'snow' : S.ov.cond === 'rain' ? 'rain' : 'sun'; }
  else if (wx.source === 'estimate') { big = Math.round((wx.fMin + wx.fMax) / 2); cond = `Typical for ${wx.month}`; icon = 'cloud'; }
  else { big = Math.round(wx.temp); cond = wx.label; icon = wx.icon; }
  let sub = '';
  if (wx.source === 'live') {
    sub = `<div class="wx-sub">Feels ${eff}° · H ${Math.round(wx.hi)}° L ${Math.round(wx.lo)}°</div>` +
      `<div class="wx-sub">Rain ${Math.round(wx.rain)}% · Wind ${Math.round(wx.wind)} m/s</div>`;
  } else if (wx.source === 'estimate') {
    sub = `<div class="wx-sub">H ${Math.round(wx.hi)}° L ${Math.round(wx.lo)}°</div>`;
  }
  let note;
  if (S.ov) note = 'Set by you';
  else if (wx.source === 'estimate') note = "Can't reach the forecast, so this is a typical day. Tap Edit to set today's weather.";
  else note = `Copenhagen · updated ${hhmm(wx.updated)}`;
  const edit = S.wxEdit ? `
    <div class="wx-edit">
      <div class="row-between"><span>Feels like</span>
        <div class="stepper"><button data-act="wx-dec" aria-label="Colder">&minus;</button><b>${S.ov ? S.ov.feels : eff}°</b><button data-act="wx-inc" aria-label="Warmer">+</button></div></div>
      <div class="seg" role="group" aria-label="Conditions">${['dry', 'rain', 'snow'].map(c =>
        `<button data-act="wx-cond" data-c="${c}" aria-pressed="${(S.ov ? S.ov.cond : wx.snow ? 'snow' : wx.wet ? 'rain' : 'dry') === c}">${{ dry: 'Dry', rain: 'Rain', snow: 'Snow' }[c]}</button>`).join('')}</div>
      ${S.ov && S.wxState !== 'offline' ? '<button class="btn plain" data-act="wx-reset">Use the forecast</button>' : ''}
    </div>` : '';
  return `<section class="card wx" aria-label="Weather">
    <div class="wx-top"><div class="wx-temp">${big}°</div><div class="wx-txt"><div class="wx-cond">${esc(cond)}</div>${sub}</div><div class="wx-ic">${ic(icon)}</div></div>
    <div class="wx-foot"><p class="foot">${esc(note)}</p>
      <span>${S.wxState === 'offline' ? '<button class="link" data-act="wx-retry">Try again</button> ' : ''}<button class="link" data-act="wx-edit">${S.wxEdit ? 'Done' : 'Edit'}</button></span></div>
    ${edit}</section>`;
}

function viewToday() {
  const now = new Date(), hr = now.getHours();
  const greet = hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening';
  const date = now.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });
  let h = `<header class="head"><div><p class="eyebrow">${esc(date)}</p><h1>${greet}</h1></div></header>`;
  h += weatherCard();
  if (!S.items.length) return h + emptyWardrobe();

  const done = todaysOutfit();
  if (done) {
    return h + `<section class="card pad"><div class="done-h">${ic('check')}Today's outfit</div>${collage(done.items)}</section>
      <button class="btn tint block" data-act="undo">Change today's outfit</button>`;
  }

  const tags = allTags();
  if (tags.length) {
    h += `<section><p class="sect-label">Occasion</p><div class="chips">
      <button class="chip ${!S.tag ? 'on' : ''}" data-act="occ" data-tag="">Anything</button>

  if (!S.sug.ok) {
    return h + `<section class="empty"><div class="badge-ic">${ic('hanger', 'lg')}</div><h2>Add a few more pieces</h2>
      <p>I need ${esc(S.sug.need)} that isn't in the wash to put an outfit together.</p>

    ? `<div class="seg" role="tablist" aria-label="Outfit options">${list.map((_, i) =>

    : `<p class="foot">Only one outfit fits right now. Add more clothes to get more choices.</p>`;

}

/* ---------- sheets ---------- */
let pushed = false;
function showSheet(html, keepScroll) {
  const r = $('#sheetRoot');
  let sh = r.querySelector('.sheet');
  if (!sh) {
    r.innerHTML = '<div class="scrim" data-act="sheet-close"></div><section class="sheet" role="dialog" aria-modal="true" aria-label="Details"><div class="grab"></div><div class="sheet-in"></div></section>';
    sh = r.querySelector('.sheet'); void sh.offsetWidth;
  }
  r.classList.add('open'); document.body.classList.add('lock');
  if (!pushed) { try { history.pushState({ sheet: 1 }, ''); pushed = true; } catch (e) { /* fine */ } }
  const inn = sh.querySelector('.sheet-in'), st = sh.scrollTop;
  inn.innerHTML = html; sh.scrollTop = keepScroll ? st : 0;
}
function freeE() { if (E && E.url) URL.revokeObjectURL(E.url); E = null; }
function closeSheet(fromPop) {
  const r = $('#sheetRoot');
  if (!r.querySelector('.sheet')) return;
  r.classList.remove('open'); document.body.classList.remove('lock');
  setTimeout(() => { if (!r.classList.contains('open')) r.innerHTML = ''; }, 340);
  if (!fromPop && pushed) { pushed = false; try { history.back(); } catch (e) { /* fine */ } } else pushed = false;
  S.queue = []; freeE();
}
window.addEventListener('popstate', () => { if (pushed) { pushed = false; closeSheet(true); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !E) closeSheet(); });

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600);
}

      <p class="foot">Tip: lay each piece flat on a plain surface in good light. The app reads the color from the middle of the photo.</p></div>`);

const DEFAULT_WARMTH = { top: 2, bottom: 2, dress: 2, outer: 2, shoes: 2, acc: 1 };
const HINTS = {
  top: 'Light: tee or tank. Medium: long sleeve or thin knit. Warm: thick sweater or hoodie.',
  bottom: 'Light: shorts or a skirt. Medium: jeans or trousers. Warm: thick or lined.',
  dress: 'Light: summer dress. Medium: everyday dress. Warm: knit or lined dress.',
  outer: 'Light: thin jacket or cardigan. Medium: regular jacket. Warm: winter coat.'
};

async function startAdd(files) {
  files = [...files]; if (!files.length) return;
  showSheet(`<div class="busy"><p>Getting your photos ready</p><span class="foot" id="busyN">0 of ${files.length}</span></div>`);
  const ok = []; let failed = 0;
  for (let i = 0; i < files.length; i++) {
    try { ok.push(await prepare(files[i])); } catch (e) { failed++; }
    const n = $('#busyN'); if (n) n.textContent = `${i + 1} of ${files.length}`;
  }
  if (!ok.length) { closeSheet(); toast("Couldn't read those photos"); return; }
  if (failed) toast(`${failed} photo${failed > 1 ? 's' : ''} couldn't be read`);
  S.queue = ok; S.queueTotal = ok.length; S.lastCat = null;
  nextInQueue();
}
function newE(p, pos) {
  // photos usually come in batches of the same kind, so start from the last type picked
  const cat = S.lastCat || (S.cat !== 'all' ? S.cat : 'top');
  freeE();
  E = { mode: 'add', id: uid(), photo: p.blob, thumb: p.thumb, url: URL.createObjectURL(p.blob), name: '', category: cat, color: p.color, autoColor: true,
        warmth: DEFAULT_WARMTH[cat], warmTouched: false, wp: false, tags: [], fav: false, wash: false, pos, total: S.queueTotal, addedAt: Date.now() };
}
function nextInQueue() {
  const p = S.queue.shift();
  if (!p) { closeSheet(); return; }
  newE(p, S.queueTotal - S.queue.length);
  renderEditor(false);
}
function openEdit(id) {
  const it = S.items.find(i => i.id === id); if (!it) return;
  freeE();
  E = { mode: 'edit', id: it.id, photo: it.photo, thumb: it.thumb, url: URL.createObjectURL(it.photo), name: it.name || '', category: it.category, color: it.color,
        autoColor: false, warmth: it.warmth || 2, warmTouched: true, wp: !!it.wp, tags: [...(it.tags || [])], fav: !!it.fav, wash: !!it.wash, pos: 1, total: 1, addedAt: it.addedAt };
  renderEditor(false);
}
function renderEditor(keep) { showSheet(editorHTML(), keep); }

function editorHTML() {
  const e = E, cat = e.category, c = COLOR[e.color] || COLORS[0], used = allTags();
  const title = e.mode === 'edit' ? 'Edit item' : e.total > 1 ? `Item ${e.pos} of ${e.total}` : 'New item';
  const cancel = e.mode === 'add' && e.total > 1 ? 'Stop' : 'Cancel';
  const sugg = (used.length ? used : ['school', 'weekend', 'party']).filter(t => !e.tags.includes(t)).slice(0, 8);
  const wsel = ['Light', 'Medium', 'Warm'].map((l, i) => `<button data-act="ed-warm" data-v="${i + 1}" aria-pressed="${e.warmth === i + 1}">${l}</button>`).join('');
  const sw = (k, label, sub, on) => `<div class="row"><span class="grow">${label}${sub ? `<small>${sub}</small>` : ''}</span><button class="sw" role="switch" aria-checked="${on}" aria-label="${label}" data-act="ed-toggle" data-k="${k}"></button></div>`;
  let rows = '';
  if (cat === 'outer') rows += sw('wp', 'Rain-proof', 'Used on wet days', e.wp);
  if (cat === 'shoes') rows += sw('wp', 'Waterproof', 'Used on wet days', e.wp);
  if (cat === 'acc') rows += sw('warm', 'Keeps me warm', 'Scarf, hat or gloves', e.warmth === 3);
  rows += sw('fav', 'Favorite', '', e.fav) + sw('wash', 'In the wash', 'Left out of outfit ideas until you switch it off', e.wash);
  const skipBtn = e.mode === 'add' && S.queue.length ? '<button class="btn plain" data-act="ed-skip">Skip this photo</button>' : '';
  const delBtn = e.mode === 'edit' ? `<button class="btn tint block danger" data-act="ed-delete">${e.confirmDel ? 'Tap again to delete' : 'Delete item'}</button>` : '';
  return `<div class="sheet-h"><button class="btn plain" data-act="ed-cancel">${cancel}</button><h3>${title}</h3><button class="btn plain strong" data-act="ed-save">Save</button></div>
  <div class="sheet-b">
    <div class="photo"><img src="${e.url}" alt="Photo of this item"><button class="chip" data-act="ed-photo">${ic('camera', 'sm')} Change photo</button></div>
    <section><input id="ed-name" class="field" type="text" placeholder="Name (optional)" maxlength="40" value="${esc(e.name)}" autocomplete="off"></section>
    <section><p class="cap-h">Type</p><div class="chips wrap" style="padding-inline:16px">${CATS.map(k => `<button class="chip ${k.id === cat ? 'on' : ''}" data-act="ed-cat" data-v="${k.id}">${k.one}</button>`).join('')}</div></section>
    <section><p class="cap-h">Color: ${c.name}</p><div class="group"><div class="swatches">${COLORS.map(k =>
      `<button class="sw-c ${k.id === e.color ? 'on' : ''}" data-act="ed-color" data-v="${k.id}" style="--c:${k.hex}" aria-label="${k.name}" aria-pressed="${k.id === e.color}"></button>`).join('')}</div></div>
      ${e.autoColor ? '<p class="cap-f">Picked from your photo. Tap another color if it is wrong.</p>' : ''}</section>
    ${HINTS[cat] ? `<section><p class="cap-h">How warm is it?</p><div class="seg" role="group" aria-label="Warmth">${wsel}</div><p class="cap-f">${HINTS[cat]}</p></section>` : ''}
    <section><p class="cap-h">Tags</p>
      <div class="tagbox">${e.tags.map(t => `<span class="tag">${esc(t)}<button data-act="tag-del" data-v="${esc(t)}" aria-label="Remove ${esc(t)}">${ic('x', 'sm')}</button></span>`).join('')}
        <input id="ed-tag" type="text" placeholder="${e.tags.length ? 'Add another' : 'school, party, cozy…'}" maxlength="24" enterkeyhint="done" autocomplete="off"></div>
      ${sugg.length ? `<div class="chips wrap sugg">${sugg.map(t => `<button class="chip" data-act="tag-quick" data-v="${esc(t)}">${ic('plus', 'sm')} ${esc(t)}</button>`).join('')}</div>` : ''}</section>
    <section><div class="group">${rows}</div></section>
    ${skipBtn}${delBtn}
  </div>`;
}

function addTag(raw) {
  const t = String(raw || '').trim().toLowerCase().replace(/\s+/g, ' ').slice(0, 24);
  if (t && !E.tags.includes(t) && E.tags.length < 12) E.tags.push(t);
}

async function saveEditor() {
  const tg = $('#ed-tag'); if (tg && tg.value.trim()) addTag(tg.value);
  const cat = E.category;
  const it = { id: E.id, name: E.name.trim(), category: cat, color: E.color, warmth: E.warmth, wp: (cat === 'outer' || cat === 'shoes') && !!E.wp,
               tags: [...E.tags], fav: !!E.fav, wash: !!E.wash, photo: E.photo, thumb: E.thumb, addedAt: E.addedAt || Date.now() };
  try { await DB.put('items', it); } catch (err) { toast("Couldn't save. Is the device storage full?"); return; }
  const i = S.items.findIndex(x => x.id === it.id);
  if (i >= 0) S.items[i] = it; else S.items.push(it);
  const adding = E.mode === 'add';
  if (adding) S.lastCat = cat;
  if (adding && S.items.length === 1) persistStorage();
  if (adding && S.queue.length) { nextInQueue(); }
  else { const total = S.queueTotal; closeSheet(); toast(adding ? (total > 1 ? `Added ${total} items` : 'Added to your wardrobe') : 'Saved'); }
  recompute(); render();
}

async function persistStorage() {
  try { if (navigator.storage && navigator.storage.persist) S.persisted = await navigator.storage.persist(); } catch (e) { /* ignore */ }
}

/* ---------- backup ---------- */
async function exportData() {
  try {
    const items = [];
    for (const it of S.items) items.push({ ...it, photo: await blobToDataURL(it.photo), thumb: it.thumb ? await blobToDataURL(it.thumb) : null });
    const blob = new Blob([JSON.stringify({ app: 'dressed', version: 1, exportedAt: new Date().toISOString(), items, history: S.history })], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `dressed-backup-${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
    toast('Backup saved to your downloads');
  } catch (e) { toast("Couldn't make the backup"); }
}
async function importData(file) {
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'dressed' || !Array.isArray(data.items)) throw new Error('format');
    dropAllUrls();
    for (const raw of data.items) {
      const it = { ...raw, photo: dataURLToBlob(raw.photo), thumb: raw.thumb ? dataURLToBlob(raw.thumb) : dataURLToBlob(raw.photo) };
      await DB.put('items', it);
    }
    for (const h of data.history || []) await DB.put('history', h);
    S.items = await DB.all('items'); S.history = await DB.all('history');
    recompute(); render(); toast(`Restored ${data.items.length} item${data.items.length === 1 ? '' : 's'}`);
  } catch (e) { toast("That file isn't a Dressed backup"); }
}

/* ---------- actions ---------- */
const A = {
  tab(el) { S.tab = el.dataset.tab; S.confirmReset = false; window.scrollTo(0, 0); render(); },
  occ(el) { S.tag = el.dataset.tag || null; S.shuffle = 0; recompute(); render(); },
  opt(el) { S.idx = +el.dataset.i; render(); },
  shuffle() { S.shuffle++; recompute(); render(); },
  async approve() {
    const o = S.sug && S.sug.ok && S.sug.list[S.idx]; if (!o) return;
    const wx = curWx();
    const rec = { date: todayStr(), ids: o.items.map(i => i.id), temp: Math.round(Engine.effectiveTemp(wx)), wet: !!wx.wet, at: Date.now() };
    await DB.put('history', rec);
    S.history = S.history.filter(h => h.date !== rec.date).concat(rec);
    render(); window.scrollTo(0, 0); toast('Saved to your diary');
  },
  async undo() { await DB.del('history', todayStr()); S.history = S.history.filter(h => h.date !== todayStr()); recompute(); render(); },
  'wx-edit'() { S.wxEdit = !S.wxEdit; render(); },
  'wx-dec'() { ovStep(-1); },
  'wx-inc'() { ovStep(1); },
  'wx-cond'(el) { const w = curWx(); S.ov = S.ov || { feels: Math.round(Engine.effectiveTemp(w)), cond: 'dry' }; S.ov.cond = el.dataset.c; recompute(); render(); },
  'wx-reset'() { S.ov = null; recompute(); render(); },
  'wx-retry'() { loadWeather(true); },
  'wx-refresh'() { toast('Checking the forecast'); loadWeather(true); },
  add() { addMenu(); },
  'add-lib'() { $('#fileLib').click(); },
  'add-cam'() { $('#fileCam').click(); },
  cat(el) { S.cat = el.dataset.cat; render(); },
  wtag(el) { S.wtag = el.dataset.tag || null; render(); },
  edit(el) { openEdit(el.dataset.id); },
  'sheet-close'() { if (!E) closeSheet(); },
  'ed-cancel'() { closeSheet(); },
  'ed-skip'() { nextInQueue(); },
  'ed-save'() { saveEditor(); },
  'ed-photo'() { $('#fileOne').click(); },
  'ed-cat'(el) { E.category = el.dataset.v; if (!E.warmTouched) E.warmth = DEFAULT_WARMTH[E.category]; renderEditor(true); },
  'ed-color'(el) { E.color = el.dataset.v; E.autoColor = false; renderEditor(true); },
  'ed-warm'(el) { E.warmth = +el.dataset.v; E.warmTouched = true; renderEditor(true); },
  'ed-toggle'(el) {
    const k = el.dataset.k;
    if (k === 'warm') { E.warmth = E.warmth === 3 ? 1 : 3; E.warmTouched = true; } else E[k] = !E[k];
    renderEditor(true);
  },
  'tag-del'(el) { E.tags = E.tags.filter(t => t !== el.dataset.v); renderEditor(true); },
  'tag-quick'(el) { addTag(el.dataset.v); renderEditor(true); },
  async 'ed-delete'() {
    if (!E.confirmDel) { E.confirmDel = true; renderEditor(true); return; }
    const id = E.id;
    await DB.del('items', id); S.items = S.items.filter(i => i.id !== id); dropUrls(id);
    closeSheet(); toast('Deleted'); recompute(); render();
  },
  'diary-open'(el) {
    const date = el.dataset.date, h = S.history.find(x => x.date === date); if (!h) return;
    const items = h.ids.map(id => S.items.find(i => i.id === id)).filter(Boolean);
    showSheet(`<div class="sheet-h"><span></span><h3>${esc(dayLabel(date))}</h3><button class="btn plain strong" data-act="sheet-close">Done</button></div>
      <div class="sheet-b"><div class="card pad">${collage(items)}</div>
      <button class="btn tint block danger" data-act="diary-del" data-date="${date}">Remove from diary</button></div>`);
  },
  async 'diary-del'(el) {
    await DB.del('history', el.dataset.date); S.history = S.history.filter(h => h.date !== el.dataset.date);
    closeSheet(); recompute(); render(); toast('Removed');
  },
  accent(el) { store.set('dressed.accent', el.dataset.k); applyAccent(); render(); },
  export() { exportData(); },
  import() { $('#fileImport').click(); },
  async install() {
    const ev = S.installEvt; if (!ev) return;
    ev.prompt(); try { await ev.userChoice; } catch (e) { /* ignore */ }
    S.installEvt = null; render();
  },
  async reset() {
    if (!S.confirmReset) { S.confirmReset = true; render(); setTimeout(() => { if (S.confirmReset) { S.confirmReset = false; if (S.tab === 'settings') render(); } }, 4000); return; }
    await DB.clear('items'); await DB.clear('history'); dropAllUrls();
    S.items = []; S.history = []; S.confirmReset = false; S.tag = null; S.cat = 'all'; S.wtag = null;
    recompute(); render(); toast('Everything deleted');
  }
};
function ovStep(d) {
  const w = curWx(); S.ov = S.ov || { feels: Math.round(Engine.effectiveTemp(w)), cond: w.snow ? 'snow' : w.wet ? 'rain' : 'dry' };
  S.ov.feels = Math.max(-25, Math.min(40, S.ov.feels + d)); recompute(); render();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (E && act.startsWith('ed-') && act !== 'ed-delete') E.confirmDel = false;
  if (A[act]) A[act](el, e);
});
document.addEventListener('input', e => { if (E && e.target.id === 'ed-name') E.name = e.target.value; });
document.addEventListener('keydown', e => {
  if (E && e.target.id === 'ed-tag' && (e.key === 'Enter' || e.key === ',')) {
    e.preventDefault(); addTag(e.target.value); renderEditor(true);
    const t = $('#ed-tag'); if (t) t.focus();
  }
});
$('#fileLib').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; startAdd(f); });
$('#fileCam').addEventListener('change', e => { const f = [...e.target.files]; e.target.value = ''; startAdd(f); });
$('#fileOne').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f || !E) return;
  try {
    const p = await prepare(f); if (!E) return;
    if (E.url) URL.revokeObjectURL(E.url);
    E.photo = p.blob; E.thumb = p.thumb; E.url = URL.createObjectURL(p.blob);
    if (E.autoColor) E.color = p.color;
    renderEditor(true);
  } catch (err) { toast("Couldn't read that photo"); }
});
$('#fileImport').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; if (f) importData(f); });
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.tab === 'settings') render(); });
window.addEventListener('appinstalled', () => { S.installEvt = null; if (S.tab === 'settings') render(); });
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (S.day !== todayStr()) { S.day = todayStr(); S.shuffle = 0; S.ov = null; S.wxEdit = false; loadWeather(true); }
  else if (S.wx && S.wx.source === 'live' && Date.now() - S.wx.updated > 45 * 60e3) loadWeather(true);
});

/* ---------- start ---------- */
(async function boot() {
  applyAccent();
  await DB.open();
  try { S.items = await DB.all('items'); S.history = await DB.all('history'); } catch (e) { S.items = []; S.history = []; }
  const dow = new Date().getDay();
  if (dow >= 1 && dow <= 5) { const t = allTags().find(x => x.includes('school')); if (t) S.tag = t; }
  try { if (navigator.storage && navigator.storage.persisted) S.persisted = await navigator.storage.persisted(); } catch (e) { /* ignore */ }
  render();
  loadWeather(false);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.__dressed = { S, A, render, DB };
})();
})();

</script>
</body>
</html>
